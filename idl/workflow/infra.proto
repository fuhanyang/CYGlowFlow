syntax = "proto3";

package workflow.infra.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "common.proto";

option go_package = "workflow/infra";

// 通用枚举定义（全局复用）
// 工作流状态
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;  // 未指定（默认值）
  WORKFLOW_STATUS_INACTIVE = 1;     // 停用
  WORKFLOW_STATUS_ACTIVE = 2;       // 启用
  WORKFLOW_STATUS_DELETED = 3;      // 已删除
}

// 工作流触发类型
enum TriggerType {
  TRIGGER_TYPE_UNSPECIFIED = 0;
  TRIGGER_TYPE_MANUAL = 1;          // 手动触发
  TRIGGER_TYPE_CRON = 2;            // 定时触发（Cron表达式）
  TRIGGER_TYPE_WEBHOOK = 3;         // Webhook触发
}

// 执行状态
enum ExecutionStatus {
  EXECUTION_STATUS_UNSPECIFIED = 0;
  EXECUTION_STATUS_RUNNING = 1;     // 运行中
  EXECUTION_STATUS_SUCCEEDED = 2;   // 执行成功
  EXECUTION_STATUS_FAILED = 3;      // 执行失败
  EXECUTION_STATUS_CANCELLED = 4;   // 已取消
}

// 故障类型
enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_PARAM = 1;             // 参数错误
  ERROR_TYPE_NETWORK = 2;           // 网络异常
  ERROR_TYPE_DATASOURCE = 3;        // 数据源错误
  ERROR_TYPE_NODE = 4;              // 节点执行错误
  ERROR_TYPE_SYSTEM = 5;            // 系统错误
}

// 通用消息定义（全局复用）
// 分页请求参数
message PageRequest {
  int32 page = 1;          // 页码（默认1）
  int32 page_size = 2;     // 每页条数（默认10，最大100）
  string keyword = 3;      // 搜索关键词（可选）
}

// 分页响应公共字段
message PageResponse {
  int32 total = 1;         // 总条数
  int32 total_pages = 2;   // 总页数
  int32 current_page = 3;  // 当前页码
  int32 page_size = 4;     // 每页条数
}


// 业务核心消息定义
// 封装后的节点配置（简化版n8n节点）
message NodeConfig {
  string node_id = 1;              // 节点唯一ID（平台生成）
  string node_type = 2;            // 封装节点类型（如：quick-http、db-postgres、email-send）
  string name = 3;                 // 节点名称（显示用）
  map<string, google.protobuf.Any> params = 4;  // 节点参数（键值对，支持任意类型）
  repeated string input_nodes = 5; // 输入节点ID（依赖的前置节点）
}

// 触发配置（根据TriggerType动态适配）
message TriggerConfig {
  TriggerType type = 1;            // 触发类型
  string cron_expr = 2;            // Cron表达式（TriggerType=Cron时必填）
  string webhook_url = 3;          // Webhook地址（TriggerType=Webhook时自动生成）
  bool webhook_auth = 4;           // Webhook是否需要鉴权（默认true）
  string webhook_secret = 5;       // Webhook鉴权密钥（自动生成）
}

// 工作流基本信息
message WorkflowInfo {
  string workflow_id = 1;          // 工作流ID（平台唯一标识）
  string name = 2;                 // 工作流名称
  string description = 3;          // 工作流描述
  WorkflowStatus status = 4;       // 工作流状态
  TriggerType trigger_type = 5;    // 触发类型
  TriggerConfig trigger_config = 6; // 触发配置
  repeated NodeConfig nodes = 7;   // 节点配置列表
  google.protobuf.Timestamp create_time = 8; // 创建时间
  google.protobuf.Timestamp update_time = 9; // 更新时间
  string creator = 10;             // 创建人ID
}

// 工作流执行请求参数
message ExecuteWorkflowRequest {
  string workflow_id = 1;          // 工作流ID（必填）
  map<string, google.protobuf.Any> input_data = 2; // 输入数据（可选）
  bool wait_for_result = 3;        // 是否等待执行结果（默认false，异步执行）
}

// 工作流执行信息
message ExecutionInfo {
  string execution_id = 1;         // 执行ID（平台唯一标识）
  string workflow_id = 2;          // 关联工作流ID
  ExecutionStatus status = 3;      // 执行状态
  google.protobuf.Timestamp start_time = 4; // 开始时间
  google.protobuf.Timestamp end_time = 5;   // 结束时间
  double duration = 6;             // 执行耗时（秒）
  map<string, google.protobuf.Any> input_data = 7; // 输入数据
  map<string, google.protobuf.Any> output_data = 8; // 输出数据（成功时返回）
  ErrorInfo error = 9;             // 错误信息（失败时返回）
  string executor = 10;            // 执行人ID（手动触发时）
}

// 错误详情
message ErrorInfo {
  ErrorType error_type = 1;        // 错误类型
  string error_msg = 2;            // 错误描述
  string error_stack = 3;          // 错误堆栈（调试用）
  string node_id = 4;              // 出错节点ID（节点错误时返回）
  google.protobuf.Timestamp error_time = 5; // 错误发生时间
}

// 工作流参数配置（环境变量/全局参数）
message WorkflowParams {
  string workflow_id = 1;          // 工作流ID（必填）
  map<string, google.protobuf.Any> params = 2; // 参数键值对（支持任意类型）
}

// 执行指标统计
message ExecutionMetric {
  string workflow_id = 1;          // 工作流ID
  string workflow_name = 2;        // 工作流名称
  int32 total_executions = 3;      // 今日总执行次数
  int32 success_count = 4;         // 今日成功次数
  int32 failed_count = 5;          // 今日失败次数
  double success_rate = 6;         // 成功率（%）
  double avg_duration = 7;         // 平均执行耗时（秒）
  double max_duration = 8;         // 最大执行耗时（秒）
  google.protobuf.Timestamp update_time = 9; // 指标更新时间
}

// 故障告警通知
message ErrorAlert {
  string alert_id = 1;             // 告警ID
  string workflow_id = 2;          // 关联工作流ID
  string workflow_name = 3;        // 工作流名称
  string execution_id = 4;         // 关联执行ID
  ErrorInfo error = 5;             // 错误详情
  google.protobuf.Timestamp alert_time = 6; // 告警时间
  repeated string notify_channels = 7; // 通知渠道（如：email、dingtalk、system）
  bool is_handled = 8;             // 是否已处理（默认false）
}

// 核心服务定义（gRPC服务接口）
// 工作流管理服务（创建/查询/更新/删除工作流）
service WorkflowManagerService {
  // 创建工作流
  rpc CreateWorkflow(WorkflowInfo) returns (BaseResponse);

  // 查询工作流列表（支持分页和筛选）
  rpc ListWorkflows(PageRequest) returns (BaseResponse);

  // 查询工作流详情
  rpc GetWorkflowDetail(string) returns (BaseResponse); // 请求参数：workflow_id

  // 更新工作流配置（部分更新）
  rpc UpdateWorkflow(WorkflowInfo) returns (BaseResponse);

  // 启用/停用工作流
  rpc UpdateWorkflowStatus(UpdateStatusRequest) returns (BaseResponse);

  // 删除工作流
  rpc DeleteWorkflow(string) returns (BaseResponse); // 请求参数：workflow_id
}

// 工作流执行管理服务（触发执行/查询状态/终止执行）
service ExecutionManagerService {
  // 触发工作流执行
  rpc ExecuteWorkflow(ExecuteWorkflowRequest) returns (BaseResponse);

  // 查询执行列表（支持分页和筛选）
  rpc ListExecutions(ExecutionQueryRequest) returns (BaseResponse);

  // 查询执行详情
  rpc GetExecutionDetail(string) returns (BaseResponse); // 请求参数：execution_id

  // 终止正在运行的执行
  rpc CancelExecution(string) returns (BaseResponse); // 请求参数：execution_id
}

// 工作流参数配置服务（全局参数/工作流级参数）
service WorkflowParamService {
  // 设置工作流参数（覆盖/新增）
  rpc SetWorkflowParams(WorkflowParams) returns (BaseResponse);

  // 获取工作流参数
  rpc GetWorkflowParams(string) returns (BaseResponse); // 请求参数：workflow_id

  // 删除工作流参数
  rpc DeleteWorkflowParam(DeleteParamRequest) returns (BaseResponse);
}

// 监控告警服务（指标统计/故障上报/告警管理）
service MonitorAlertService {
  // 获取工作流执行指标（今日/昨日/自定义时间范围）
  rpc GetExecutionMetrics(MetricQueryRequest) returns (BaseResponse);

  // 获取故障告警列表（支持分页和筛选）
  rpc ListErrorAlerts(AlertQueryRequest) returns (BaseResponse);

  // 标记告警已处理
  rpc MarkAlertHandled(string) returns (BaseResponse); // 请求参数：alert_id
}

// 补充请求消息（服务方法的复杂请求参数）
// 更新工作流状态请求
message UpdateStatusRequest {
  string workflow_id = 1;          // 工作流ID（必填）
  WorkflowStatus status = 2;       // 目标状态（ACTIVE/INACTIVE）
}

// 执行查询请求（扩展分页参数）
message ExecutionQueryRequest {
  PageRequest page = 1;            // 分页参数
  string workflow_id = 2;          // 工作流ID（可选，筛选指定工作流）
  ExecutionStatus status = 3;      // 执行状态（可选，筛选指定状态）
  google.protobuf.Timestamp start_time = 4; // 开始时间（可选，时间范围筛选）
  google.protobuf.Timestamp end_time = 5;   // 结束时间（可选，时间范围筛选）
}

// 删除参数请求
message DeleteParamRequest {
  string workflow_id = 1;          // 工作流ID（必填）
  string param_key = 2;            // 要删除的参数键（必填）
}

// 指标查询请求
message MetricQueryRequest {
  string workflow_id = 1;          // 工作流ID（可选，为空查所有）
  string time_range = 2;           // 时间范围（today/yesterday/7days/custom）
  google.protobuf.Timestamp custom_start = 3; // 自定义开始时间（time_range=custom时必填）
  google.protobuf.Timestamp custom_end = 4;   // 自定义结束时间（time_range=custom时必填）
}

// 告警查询请求（扩展分页参数）
message AlertQueryRequest {
  PageRequest page = 1;            // 分页参数
  string workflow_id = 2;          // 工作流ID（可选）
  ErrorType error_type = 3;        // 错误类型（可选）
  bool is_handled = 4;             // 是否已处理（可选）
  google.protobuf.Timestamp start_time = 5; // 开始时间（可选）
  google.protobuf.Timestamp end_time = 6;   // 结束时间（可选）
}