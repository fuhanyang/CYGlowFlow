linters-settings:
  goimports:
    local-prefixes: github.com/fuhanyang/CYGlowFlow

linters:
  enable:
    - govet         # 常见错误检查 - 编译层面问题
    - errcheck      # 错误处理检查 - 必须处理的错误

run:
  go: "1.25"
  timeout: 5m

issues:
  exclude-dirs:
    - vendor
    - hertz_gen
    - kitex_gen
    - rpc_gen
  exclude-files:
    - ".*\\.(pb\\.go|gen\\.go)$"
  exclude-rules:
    # 测试文件中排除errcheck，避免每个错误都必须检查的问题
    - path: _test\\.go
      linters:
        - errcheck
    # 排除生成的代码
    - path: (hertz_gen|kitex_gen|rpc_gen)
      linters:
        - all