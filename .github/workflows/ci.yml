name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        
    - name: Run gofmt
      run: |
        test -z $(gofmt -l .)
        
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        
    - name: Run unit tests
      run: |
        go test -v -race ./...
        
    - name: Generate test coverage
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic ./...
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: unit-tests
    
    strategy:
      matrix:
        service: [gateway, user]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        
    - name: Build ${{ matrix.service }}
      run: |
        cd app/${{ matrix.service }}
        go build -o ../../${{ matrix.service }}-service
        chmod +x ../../${{ matrix.service }}-service
        
    - name: Upload binary artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ matrix.service }}-binary
        path: ${{ matrix.service }}-service

  build-images:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build-binaries
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Gateway image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./app/gateway/Dockerfile
        push: true
        tags: |
          liangjiaqi873/cyglowflow-gateway:${{ github.sha }}
          liangjiaqi873/cyglowflow-gateway:${{ github.ref == 'refs/heads/dev' && 'dev-latest' || github.ref == 'refs/heads/main' && 'prod-latest' || github.ref_name }}
        build-args: |
          BUILD_ENV=${{ github.ref == 'refs/heads/dev' && 'test' || github.ref == 'refs/heads/main' && 'prod' || 'prod' }}
          
    - name: Build and push User service image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./app/user/Dockerfile
        push: true
        tags: |
          liangjiaqi873/cyglowflow-user:${{ github.sha }}
          liangjiaqi873/cyglowflow-user:${{ github.ref == 'refs/heads/dev' && 'dev-latest' || github.ref == 'refs/heads/main' && 'prod-latest' || github.ref_name }}
        build-args: |
          BUILD_ENV=${{ github.ref == 'refs/heads/dev' && 'test' || github.ref == 'refs/heads/main' && 'prod' || 'prod' }}
